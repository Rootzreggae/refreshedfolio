[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404

# ── Password-protected routes ──────────────────────────────────
# The auth edge function intercepts these paths and checks for a
# valid portfolio_auth cookie. Add more [[edge_functions]] blocks
# to protect additional routes, e.g.:
#   [[edge_functions]]
#     path = "/projects/another-project/*"
#     function = "auth"
[[edge_functions]]
  path = "/projects/dynatrace"
  function = "auth"

[[edge_functions]]
  path = "/projects/dynatrace/*"
  function = "auth"